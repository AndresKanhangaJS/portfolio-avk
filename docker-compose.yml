services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile.dev
    ports:
      - "3002:3000"
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    networks:
      - avk-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - avk-network
    profiles:
      - production

networks:
  avk-network:
    driver: bridge
